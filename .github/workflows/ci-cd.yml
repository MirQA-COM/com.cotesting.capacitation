name: CI/CD Login Demo

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Stage 1 - Validar web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Quality Gate - Validacion estatica
        run: npm run validate:web

      - name: Build web
        run: npm run build:web

      - name: Publicar artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Stage 2 - Pruebas E2E
    runs-on: ubuntu-latest
    needs: validate-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Levantar aplicacion
        run: nohup npm run start:web > web.log 2>&1 &

      - name: Esperar aplicacion
        run: |
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then
              echo "Aplicacion disponible"
              exit 0
            fi
            echo "Esperando aplicacion..."
            sleep 1
          done
          echo "La aplicacion no respondio a tiempo"
          cat web.log
          exit 1

      - name: Quality Gate - E2E Login
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Publicar resultados E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results
          retention-days: 7

      - name: Publicar log de la web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: web.log
          retention-days: 7

  quality-gate:
    name: Stage 3 - Quality Gate
    runs-on: ubuntu-latest
    needs:
      - validate-web
      - e2e
    steps:
      - name: Confirmar gates
        run: echo "Quality Gate OK - validacion web y pruebas E2E aprobadas"

  deploy:
    name: Stage 4 - CD GitHub Pages
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
