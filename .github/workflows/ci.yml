name: CI - Login Demo

on:
  push:
    branches-ignore:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate-web:
    name: Stage 1 - Validar web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Quality Gate - Validación estática
        run: npm run validate:web

      - name: Build web
        run: npm run build:web

      - name: Publicar artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7


  e2e:
    name: Stage 2 - Pruebas E2E
    runs-on: ubuntu-latest

    needs: validate-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Levantar aplicación
        run: nohup npm run start:web > web.log 2>&1 &

      - name: Esperar aplicación
        run: |
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then
              echo "Aplicación disponible"
              exit 0
            fi

            echo "Esperando aplicación..."
            sleep 1
          done

          echo "La aplicación no respondió a tiempo"
          cat web.log
          exit 1

      - name: E2E Login
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Publicar resultados E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results
          retention-days: 7

      - name: Publicar log de la web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-log
          path: web.log
          retention-days: 7


  quality-gate:
    name: Stage 3 - Quality Gate
    runs-on: ubuntu-latest

    needs:
      - validate-web
      - e2e

    steps:

      - name: Evaluar Quality Gate
        run: |
          COVERAGE=79
          MIN_COVERAGE=80

          echo "======================================"
          echo "         QUALITY GATE"
          echo "======================================"
          echo "Cobertura obtenida : ${COVERAGE}%"
          echo "Cobertura requerida: ${MIN_COVERAGE}%"
          echo "======================================"

          if [ "$COVERAGE" -lt "$MIN_COVERAGE" ]; then
            echo "QUALITY GATE FALLIDO"
            echo "La cobertura está por debajo del mínimo permitido."
            exit 1
          fi

          echo "QUALITY GATE APROBADO"